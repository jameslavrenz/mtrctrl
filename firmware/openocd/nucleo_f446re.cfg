# NUCLEO-F446RE onboard ST-Link. connect_assert_srst is required on this probe
# when the target does not answer a running connect. 480 kHz is the rate that
# examined the chip reliably (IDCODE 0x10006421).
source [find target/stm32f4x.cfg]

adapter speed 480
reset_config srst_only srst_nogate connect_assert_srst

stm32f4x.cpu configure -event reset-init {
    adapter speed 480
}
